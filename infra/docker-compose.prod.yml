services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sentra-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: sentra
      POSTGRES_PASSWORD: sentra_dev_password_change_in_prod
      POSTGRES_DB: sentra

      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentra -d sentra"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - shared-web-network

    deploy:
      resources:
        limits:
          memory: 512M

    labels:
      sentra.service: "postgres"
      sentra.phase: "1"

  redis:
    image: redis:7-alpine
    container_name: sentra-redis
    restart: unless-stopped

    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 60 1000
      --loglevel notice
      --protected-mode no

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - shared-web-network

    deploy:
      resources:
        limits:
          memory: 128M

    labels:
      sentra.service: "redis"
      sentra.phase: "1"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: sentra-zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_MAX_CLIENT_CNXNS: 60
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok"
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=*"
      KAFKA_HEAP_OPTS: "-Xmx128M -Xms64M"

    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log

    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - shared-web-network

    deploy:
      resources:
        limits:
          memory: 128M

    labels:
      sentra.service: "zookeeper"
      sentra.phase: "1"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: sentra-kafka
    restart: unless-stopped

    depends_on:
      zookeeper:
        condition: service_healthy

    environment:
      KAFKA_ZOOKEEPER_CONNECT: "sentra-zookeeper:2181"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://sentra-kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_GROUP_MAX_SESSION_TIMEOUT_MS: 600000  # 10 min — allows LLM inference to complete
      KAFKA_GROUP_MIN_SESSION_TIMEOUT_MS: 6000
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: -1
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CREATE_TOPICS: >
        sentra.pr.queue:6:1:retention.ms=86400000,
        sentra.pr.retry:6:1:retention.ms=86400000,
        sentra.pr.dlq:1:1:retention.ms=604800000,
        sentra.pr.analyzed:6:1:retention.ms=86400000
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
      KAFKA_ENABLE_IDEMPOTENCE: "true"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 20"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

    networks:
      - shared-web-network

    deploy:
      resources:
        limits:
          memory: 512M

    labels:
      sentra.service: "kafka"
      sentra.phase: "1"

  # kafdrop — Kafka UI at http://localhost:8080
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: sentra-kafdrop
    restart: unless-stopped
    environment:
      KAFKA_BROKERCONNECT: "kafka:29092"
      JVM_OPTS: "-Xms32M -Xmx256M"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - shared-web-network
    profiles:
      - tools  # docker compose --profile tools up -d
    labels:
      sentra.service: "kafdrop"
      sentra.phase: "1"

  # pgadmin — PostgreSQL UI at http://localhost:5050 (admin@sentra.dev / sentra_admin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sentra-pgadmin
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@sentra.dev"
      PGADMIN_DEFAULT_PASSWORD: "sentra_admin"
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - shared-web-network

    profiles:
      - tools

    labels:
      sentra.service: "pgadmin"
      sentra.env: "development-only"


  api-gateway:
    image: ghcr.io/asylann/sentra-api-gateway:latest
    container_name: sentra-api-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://sentra:sentra_dev_password_change_in_prod@sentra-postgres:5432/sentra
      - KAFKA_BROKERS=sentra-kafka:9092
      - REDIS_ADDR=sentra-redis:6379
      - FRONTEND_URL=https://sentra-ai.me
    networks:
      - shared-web-network

  ai-worker:
    image: ghcr.io/asylann/sentra-ai-worker:latest
    container_name: sentra-ai-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - POSTGRES_URL=postgresql://sentra:sentra_dev_password_change_in_prod@sentra-postgres:5432/sentra
      - KAFKA_BROKERS=sentra-kafka:9092
      - REDIS_URL=redis://sentra-redis:6379/0
    networks:
      - shared-web-network

  web-dashboard:
    image: ghcr.io/asylann/sentra-web-dashboard:latest
    container_name: sentra-web-dashboard
    restart: unless-stopped
    networks:
      - shared-web-network

volumes:
  postgres_data:
    name: sentra_postgres_data
    labels:
      sentra.service: "postgres"

  redis_data:
    name: sentra_redis_data
    labels:
      sentra.service: "redis"

  zookeeper_data:
    name: sentra_zookeeper_data
    labels:
      sentra.service: "zookeeper"

  zookeeper_logs:
    name: sentra_zookeeper_logs
    labels:
      sentra.service: "zookeeper"

  kafka_data:
    name: sentra_kafka_data
    labels:
      sentra.service: "kafka"

  pgadmin_data:
    name: sentra_pgadmin_data
    labels:
      sentra.service: "pgadmin"

networks:
  shared-web-network:
    external: true
    name: shared-web-network
    labels:
      sentra.project: "sentra-platform"
      sentra.phase: "1"

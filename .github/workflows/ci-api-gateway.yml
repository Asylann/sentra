# Triggered only when Go source code changes (path-filtered CI)
# Research1 §4.3: dorny/paths-filter based intelligent CI pipelines
name: "CI — Go API Gateway"
on:
  pull_request:
    paths:
      - "apps/api-gateway/**"
      - "packages/contracts/**"
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: cd apps/api-gateway && go test ./...
      - run: golangci-lint run ./apps/api-gateway/...

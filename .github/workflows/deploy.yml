name: Deploy Sentra to AWS EC2

on:
  push:
    branches:
      - master
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      matrix:
        include:
          - service: api-gateway
            context: .
            dockerfile: apps/api-gateway/Dockerfile
          - service: ai-worker
            context: apps/ai-worker
            dockerfile: apps/ai-worker/Dockerfile
          - service: web-dashboard
            context: apps/web-dashboard
            dockerfile: apps/web-dashboard/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/apps/sentra || { echo "Project directory not found!"; exit 1; }
            
            echo "Pulling latest changes from Git..."
            git pull origin master || git pull origin main
            
            echo "Logging into GHCR..."
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            cd infra
            
            echo "Pulling latest images from GHCR..."
            docker compose -f docker-compose.prod.yml pull
            
            echo "Stopping old containers to free up RAM..."
            docker compose -f docker-compose.prod.yml down
            
            echo "Starting containers..."
            docker compose -f docker-compose.prod.yml up -d
            
            echo "Pruning dangling and old images..."
            docker image prune -f


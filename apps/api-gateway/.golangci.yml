# Per-service golangci-lint override. Extends root /.golangci.yml.
run:
  timeout: 5m
linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - revive
    - gosec    # Critical for security-sensitive gateway code
    - bodyclose
    - contextcheck


# =============================================================================
# Sentra Platform — Global Task Runner
# =============================================================================
# Taskfile.yml replaces GNU Makefiles for multi-language build orchestration.
# Research1 §1: "Task allows declarative parallel build tasks with source-hash caching"
# Research2 §1.3: "Language-agnostic orchestrators like Taskfile for polyglot builds"
#
# INSTALLATION:
#   Windows:  scoop install task  OR  winget install Task.Task
#   macOS:    brew install go-task
#   Linux:    sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
#
# USAGE:
#   task --list          # List all available tasks
#   task infra:up        # Start local infrastructure (Kafka, PG, Redis)
#   task proto:generate  # Generate Go + Python Protobuf stubs
#   task go:lint         # Run golangci-lint on API Gateway
#   task py:lint         # Run Ruff on AI Worker
#   task go:test         # Run Go tests
#   task py:test         # Run Python tests
#   task ci              # Full CI check (lint + test + proto-breaking)
# =============================================================================

version: "3"

# ---------------------------------------------------------------------------
# Global variables — override these with environment variables if needed
# ---------------------------------------------------------------------------
vars:
  GO_GATEWAY_DIR: "apps/api-gateway"
  PY_WORKER_DIR:  "apps/ai-worker"
  WEB_DIR:        "apps/web-dashboard"
  CONTRACTS_DIR:  "packages/contracts"
  INFRA_DIR:      "infra"
  GO_VERSION:     "1.22"
  PY_VERSION:     "3.12"

# ---------------------------------------------------------------------------
# Silent mode: suppress task headers in output for cleaner CI logs
# ---------------------------------------------------------------------------
silent: false

# ---------------------------------------------------------------------------
# Default task: run when 'task' is invoked without arguments
# ---------------------------------------------------------------------------
tasks:
  default:
    desc: "Show available tasks"
    cmds:
      - task --list

  # ==========================================================================
  # GROUP: infra — Local infrastructure lifecycle management
  # ==========================================================================

  infra:up:
    desc: "Start all local infrastructure services (PostgreSQL 16+pgvector, Redis 7, Kafka+ZooKeeper)"
    summary: |
      Boots the complete local development environment.
      Health checks are configured for each service.
      Wait ~30 seconds for Kafka to elect a partition leader on first start.
    cmds:
      - docker compose -f {{.INFRA_DIR}}/docker-compose.yml up -d
      - echo "✅ Infrastructure started. Run 'task infra:status' to verify."

  infra:down:
    desc: "Stop all local infrastructure services (data is preserved in volumes)"
    cmds:
      - docker compose -f {{.INFRA_DIR}}/docker-compose.yml down

  infra:destroy:
    desc: "⚠️  DESTROY all infrastructure AND delete all data volumes"
    prompt: "This will DELETE all local database data. Are you sure?"
    cmds:
      - docker compose -f {{.INFRA_DIR}}/docker-compose.yml down -v --remove-orphans
      - echo "🗑️  All infrastructure and volumes destroyed."

  infra:status:
    desc: "Show health status of all infrastructure containers"
    cmds:
      - docker compose -f {{.INFRA_DIR}}/docker-compose.yml ps

  infra:logs:
    desc: "Tail logs from all infrastructure containers"
    cmds:
      - docker compose -f {{.INFRA_DIR}}/docker-compose.yml logs -f --tail=50

  infra:logs:kafka:
    desc: "Tail Kafka broker logs only"
    cmds:
      - docker compose -f {{.INFRA_DIR}}/docker-compose.yml logs -f kafka --tail=100

  infra:logs:postgres:
    desc: "Tail PostgreSQL logs only"
    cmds:
      - docker compose -f {{.INFRA_DIR}}/docker-compose.yml logs -f postgres --tail=100

  # ==========================================================================
  # GROUP: proto — Protobuf schema management via Buf
  # ==========================================================================

  proto:generate:
    desc: "Generate Go and Python stubs from Protobuf schemas using buf"
    summary: |
      Runs 'buf generate' against packages/contracts/.
      Outputs Go stubs to: packages/contracts/gen/go/
      Outputs Python stubs to: packages/contracts/gen/python/
      Run this after modifying any .proto file.
    dir: "{{.CONTRACTS_DIR}}"
    cmds:
      - buf generate
      - echo "✅ Protobuf stubs regenerated."

  proto:lint:
    desc: "Run buf lint on Protobuf schemas"
    dir: "{{.CONTRACTS_DIR}}"
    cmds:
      - buf lint
      - echo "✅ Protobuf schemas pass lint."

  proto:breaking:
    desc: "Check for WIRE_JSON breaking changes against the main branch"
    summary: |
      Enforces backward compatibility of Protobuf schemas.
      Runs buf breaking with WIRE_JSON rules.
      Fails CI if any field is renamed, removed, or has its type changed.
      Research1 §2.1: WIRE_JSON is the mandatory minimum for Kafka event schemas.
    dir: "{{.CONTRACTS_DIR}}"
    cmds:
      - >
        buf breaking
        --against "https://github.com/usena/sentra.git#branch=main,subdir=packages/contracts"
      - echo "✅ No WIRE_JSON breaking changes detected."

  proto:format:
    desc: "Format all .proto files with buf format"
    dir: "{{.CONTRACTS_DIR}}"
    cmds:
      - buf format -w

  # ==========================================================================
  # GROUP: go — Go API Gateway tasks
  # ==========================================================================

  go:build:
    desc: "Build the Go API Gateway binary"
    dir: "{{.GO_GATEWAY_DIR}}"
    sources:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
    generates:
      - "bin/gateway"
    cmds:
      - go build -o bin/gateway ./cmd/gateway/
      - echo "✅ Go API Gateway built: {{.GO_GATEWAY_DIR}}/bin/gateway"

  go:test:
    desc: "Run Go unit tests with race detector and coverage"
    dir: "{{.GO_GATEWAY_DIR}}"
    cmds:
      - go test -race -cover -timeout 60s ./...
      - echo "✅ Go tests passed."

  go:test:integration:
    desc: "Run Go integration tests (requires infra:up)"
    dir: "{{.GO_GATEWAY_DIR}}"
    cmds:
      - go test -race -tags integration -timeout 120s ./...

  go:lint:
    desc: "Run golangci-lint on the Go API Gateway"
    summary: |
      Uses the configuration from apps/api-gateway/.golangci.yml.
      Linters include: errcheck, gosec, staticcheck, gosimple, revive.
      Path-filtered by lefthook (only runs on changed .go files in pre-commit).
    dir: "{{.GO_GATEWAY_DIR}}"
    cmds:
      - golangci-lint run ./...
      - echo "✅ Go lint passed."

  go:fmt:
    desc: "Format all Go source files with gofmt + goimports"
    dir: "{{.GO_GATEWAY_DIR}}"
    cmds:
      - gofmt -w .
      - goimports -w .

  go:vet:
    desc: "Run go vet on the API Gateway"
    dir: "{{.GO_GATEWAY_DIR}}"
    cmds:
      - go vet ./...

  go:sqlc:generate:
    desc: "Generate type-safe Go database code from SQL via sqlc"
    summary: |
      Reads: packages/db-schema/schema.sql + internal/webhook/queries.sql
      Writes: internal/db/ (type-safe, zero-reflection query functions)
      Research1 §2.2: sqlc for high-speed OLTP without ORM reflection overhead.
    dir: "{{.GO_GATEWAY_DIR}}"
    cmds:
      - sqlc generate
      - echo "✅ sqlc code generated."

  go:tidy:
    desc: "Run go mod tidy on the API Gateway module"
    dir: "{{.GO_GATEWAY_DIR}}"
    cmds:
      - go mod tidy

  # ==========================================================================
  # GROUP: py — Python AI Worker tasks
  # ==========================================================================

  py:install:
    desc: "Install Python AI Worker dependencies via Poetry"
    dir: "{{.PY_WORKER_DIR}}"
    cmds:
      - poetry install --with dev
      - echo "✅ Python dependencies installed."

  py:test:
    desc: "Run Python tests with pytest"
    dir: "{{.PY_WORKER_DIR}}"
    cmds:
      - poetry run pytest -v --tb=short
      - echo "✅ Python tests passed."

  py:test:coverage:
    desc: "Run Python tests with coverage report"
    dir: "{{.PY_WORKER_DIR}}"
    cmds:
      - poetry run pytest --cov=src --cov-report=term-missing --cov-report=html

  py:lint:
    desc: "Run Ruff linter on the Python AI Worker"
    summary: |
      Ruff replaces Flake8+Black with 100x speed advantage.
      Research2 §1.3: Ruff for Python linting in polyglot CI pipeline.
      Path-filtered by lefthook (only runs on changed .py files in pre-commit).
    dir: "{{.PY_WORKER_DIR}}"
    cmds:
      - poetry run ruff check src/ tests/
      - echo "✅ Python lint passed."

  py:lint:fix:
    desc: "Run Ruff with --fix to auto-correct fixable issues"
    dir: "{{.PY_WORKER_DIR}}"
    cmds:
      - poetry run ruff check --fix src/ tests/

  py:fmt:
    desc: "Format Python code with Ruff formatter (replaces Black)"
    dir: "{{.PY_WORKER_DIR}}"
    cmds:
      - poetry run ruff format src/ tests/

  py:typecheck:
    desc: "Run mypy type checking on the Python AI Worker"
    dir: "{{.PY_WORKER_DIR}}"
    cmds:
      - poetry run mypy src/ --ignore-missing-imports

  py:migrate:
    desc: "Apply Alembic database migrations"
    summary: |
      Applies pending SQL migrations to the PostgreSQL database.
      Python owns ALL migrations. Research1 §2.2.
      Requires: DATABASE_URL environment variable or .env file.
    dir: "{{.PY_WORKER_DIR}}"
    cmds:
      - poetry run alembic upgrade head
      - echo "✅ Database migrations applied."

  py:migrate:generate:
    desc: "Auto-generate a new Alembic migration from ORM model changes"
    dir: "{{.PY_WORKER_DIR}}"
    cmds:
      - poetry run alembic revision --autogenerate -m "{{.CLI_ARGS}}"

  py:migrate:rollback:
    desc: "Rollback the last Alembic migration"
    dir: "{{.PY_WORKER_DIR}}"
    cmds:
      - poetry run alembic downgrade -1

  py:dev:
    desc: "Start the FastAPI AI Worker in development mode with hot-reload"
    dir: "{{.PY_WORKER_DIR}}"
    cmds:
      - poetry run uvicorn src.presentation.api_routers.main:create_app --factory --reload --port 8001

  # ==========================================================================
  # GROUP: web — React Dashboard tasks
  # ==========================================================================

  web:install:
    desc: "Install React dashboard dependencies via pnpm"
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm install

  web:dev:
    desc: "Start React dashboard in development mode"
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm dev

  web:build:
    desc: "Build React dashboard for production"
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm build

  web:lint:
    desc: "Run ESLint on the React dashboard"
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm lint

  # ==========================================================================
  # GROUP: ci — Composite CI tasks (run all checks)
  # ==========================================================================

  ci:
    desc: "Run full CI check suite (proto + go + py)"
    summary: |
      Equivalent to what runs in GitHub Actions on every PR.
      Runs in parallel where dependencies allow.
    cmds:
      - task: proto:lint
      - task: proto:breaking
      - task: go:lint
      - task: go:test
      - task: go:vet
      - task: py:lint
      - task: py:typecheck
      - task: py:test
      - echo "✅ Full CI suite passed."

  ci:go:
    desc: "Run Go-only CI checks (lint + test + vet)"
    cmds:
      - task: go:lint
      - task: go:test
      - task: go:vet

  ci:py:
    desc: "Run Python-only CI checks (lint + typecheck + test)"
    cmds:
      - task: py:lint
      - task: py:typecheck
      - task: py:test

  # ==========================================================================
  # GROUP: setup — Developer onboarding
  # ==========================================================================

  setup:
    desc: "One-command developer environment setup"
    summary: |
      Installs all dependencies and starts infrastructure.
      Run this once after cloning the repository.
    cmds:
      - echo "🚀 Setting up Sentra development environment..."
      - task: py:install
      - task: web:install
      - task: proto:generate
      - task: infra:up
      - echo ""
      - echo "✅ Sentra environment ready!"
      - echo "   API Gateway : apps/api-gateway (Go 1.22)"
      - echo "   AI Worker   : apps/ai-worker   (Python 3.12)"
      - echo "   Dashboard   : apps/web-dashboard (React)"
      - echo ""
      - echo "Run 'task infra:status' to check service health."

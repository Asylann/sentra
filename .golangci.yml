# Global golangci-lint configuration for all Go modules.
# Applied via lefthook pre-commit on modified .go files.
run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - gosec
    - exhaustive
    - bodyclose
    - contextcheck
    - noctx
  disable:
    - depguard
    - exhaustruct

linters-settings:
  gosec:
    severity: "medium"
    confidence: "medium"
  revive:
    rules:
      - name: exported
        severity: warning

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters: [gosec, errcheck]

